[package]
name = "aegis-vault"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-types = { path = "../../crates/aegis-types" }
near-sdk = "5.30.0"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"
