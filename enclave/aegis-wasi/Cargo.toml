[package]
name = "aegis-wasi"
version = "0.1.0"
edition = "2024"

[lib]
name = "aegis_wasi"
path = "src/lib.rs"

[[bin]]
name = "aegis-wasi"
path = "src/main.rs"

[dependencies]
aegis-types = { path = "../../crates/aegis-types" }
base64 = "0.22"
bs58 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
